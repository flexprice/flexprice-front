# Security alerts + security-updates are already enabled via repo settings.
# This file adds scheduled weekly version bumps, grouped into one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait out newly published versions — fresh releases can be malicious or unstable.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # zod 4 renames APIs the code uses (ZodError.errors, ZodTypeDef, one-argument
    # z.record); a major bump needs its own change on develop, not a grouped bump.
    ignore:
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
