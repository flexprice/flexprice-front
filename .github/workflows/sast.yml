# SAST (Static Application Security Testing) — Semgrep
#
# PHASE 1: SOFT-FAIL. Findings are reported but do NOT block merge.
# Phase 2 will flip this to BLOCKING on high-confidence rules once the
# baseline of existing findings has been triaged.
#
# Secret scanning is intentionally NOT included here — GitGuardian owns secrets.

name: SAST

on:
  pull_request:

permissions:
  contents: read
  security-events: write # upload-sarif writes to the code-scanning API

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    steps:
      # Pinned to a full commit SHA — tags are mutable and can be repointed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing later in the job performs authenticated Git operations.
          persist-credentials: false

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (findings soft-fail, infra errors surface)
        run: |
          set +e
          semgrep scan \
            --config p/default \
            --config p/typescript \
            --config p/react \
            --metrics=off \
            --sarif --output semgrep.sarif
          code=$?
          # Exit 1 means findings — non-blocking in phase 1. Anything above 1 is
          # a scanner/infrastructure failure and must fail the job.
          if [ "$code" -gt 1 ]; then exit "$code"; fi

      - name: Upload SARIF
        # Pinned to a full commit SHA — tags are mutable and can be repointed.
        # Runs only when the scan step succeeded (which guarantees the SARIF file
        # exists); upload failures now fail the job instead of being swallowed.
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: semgrep.sarif
